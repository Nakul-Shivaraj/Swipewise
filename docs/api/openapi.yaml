openapi: 3.0.3
info:
  title: SwipeWise API
  version: 1.0.0
  description: SwipeWise OpenAPI documentation covering the public read-only API
    and authenticated wallet endpoints.
servers:
  - url: /
    description: Current environment
components:
  schemas:
    CategoryName:
      type: string
      enum:
        - GROCERIES
        - DINING
        - GAS
        - TRAVEL
      description: Allowed purchase categories in SwipeWise
      example: GROCERIES
    CatalogRate:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/CategoryName"
        rateX100:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 400
        capCents:
          type: integer
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          example: null
      required:
        - category
        - rateX100
    RotatingCategoryRate:
      type: object
      properties:
        quarter:
          type: string
          pattern: ^\d{4}-Q[1-4]$
          example: 2026-Q4
        category:
          $ref: "#/components/schemas/CategoryName"
        rateX100:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 500
        capCents:
          type: integer
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          example: 150000
      required:
        - quarter
        - category
        - rateX100
    RewardsProgram:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Meadow Rewards
        centsPer100Points:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 100
      required:
        - name
        - centsPer100Points
    CatalogCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        name:
          type: string
          minLength: 1
          example: Mint Everyday
        issuer:
          type: string
          minLength: 1
          example: Demo Bank
        artColor:
          type: string
          minLength: 1
          example: "#2F8C55"
        isDemo:
          type: boolean
          example: true
        annualFeeCents:
          type: integer
          minimum: 0
          example: 0
        baseRateX100:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 150
        program:
          $ref: "#/components/schemas/RewardsProgram"
        rates:
          type: array
          items:
            $ref: "#/components/schemas/CatalogRate"
        rewardRules:
          type: array
          items:
            $ref: "#/components/schemas/CatalogRate"
        rotatingCategories:
          type: array
          items:
            $ref: "#/components/schemas/RotatingCategoryRate"
      required:
        - id
        - name
        - issuer
        - artColor
        - isDemo
        - annualFeeCents
        - baseRateX100
        - program
        - rates
    PublicRankedCard:
      type: object
      properties:
        cardId:
          type: string
          format: uuid
        name:
          type: string
          example: Mint Everyday
        issuer:
          type: string
          example: Demo Bank
        artColor:
          type: string
          example: "#2F8C55"
        isDemo:
          type: boolean
          example: true
        annualFeeCents:
          type: integer
          example: 0
        programName:
          type: string
          example: Meadow Rewards
        centsPer100Points:
          type: integer
          example: 100
        appliedRateX100:
          type: integer
          example: 400
        baseRateX100:
          type: integer
          example: 150
        usedBaseRate:
          type: boolean
          example: false
        capCents:
          type: integer
          nullable: true
          example: null
        isCapExceeded:
          type: boolean
          example: false
        rewardCents:
          type: integer
          example: 400
        activationNote:
          type: string
          nullable: true
          example: null
        rank:
          type: integer
          example: 1
        isBestPick:
          type: boolean
          example: true
      required:
        - cardId
        - name
        - issuer
        - artColor
        - isDemo
        - annualFeeCents
        - programName
        - centsPer100Points
        - appliedRateX100
        - baseRateX100
        - usedBaseRate
        - capCents
        - isCapExceeded
        - rewardCents
        - activationNote
        - rank
        - isBestPick
    StoreSearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Safeway
        category:
          $ref: "#/components/schemas/CategoryName"
        aliases:
          type: array
          items:
            type: string
          example:
            - Safeway
            - safeway.com
      required:
        - id
        - name
        - category
        - aliases
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request parameters.
          required:
            - code
            - message
      required:
        - error
  parameters: {}
paths:
  /api/public/v1/cards:
    get:
      summary: List all active catalog cards
      description: Returns non-retired catalog cards with name, issuer, annual fee,
        base rate, and reward rules. Never returns user data.
      responses:
        "200":
          description: List of catalog cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogCard"
                required:
                  - cards
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public/v1/categories:
    get:
      summary: List all reward spend categories
      description: Returns the supported purchase categories.
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/CategoryName"
                required:
                  - categories
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public/v1/stores:
    get:
      summary: Search stores and their category
      description: Finds matching stores by name or alias and returns their purchase
        category.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Search query for store name or alias
            example: saf
          required: false
          description: Search query for store name or alias
          name: query
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Alternative query parameter alias
            example: saf
          required: false
          description: Alternative query parameter alias
          name: q
          in: query
      responses:
        "200":
          description: Matching stores list
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoreSearchResult"
                required:
                  - stores
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public/v1/best-card:
    get:
      summary: Rank catalog cards for a category
      description: Ranks catalog cards by reward value for a spend category and
        purchase amount. Optional cardIds filters the cards evaluated.
      parameters:
        - schema:
            $ref: "#/components/schemas/CategoryName"
          required: true
          description: Allowed purchase categories in SwipeWise
          name: category
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100000000
            default: 10000
            description: Purchase amount in integer cents
            example: 10000
          required: false
          description: Purchase amount in integer cents
          name: amountCents
          in: query
        - schema:
            type: string
            description: Optional comma-separated list of catalog card IDs to rank
            example: 00000000-0000-4000-8000-000000000001
          required: false
          description: Optional comma-separated list of catalog card IDs to rank
          name: cardIds
          in: query
      responses:
        "200":
          description: Ranked catalog cards and best recommendation pick
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: "#/components/schemas/CategoryName"
                  amountCents:
                    type: integer
                  bestCard:
                    allOf:
                      - $ref: "#/components/schemas/PublicRankedCard"
                      - nullable: true
                  rankedCards:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicRankedCard"
                required:
                  - category
                  - amountCents
                  - bestCard
                  - rankedCards
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/cards:
    get:
      summary: List all active catalog cards (legacy path)
      description: Returns non-retired catalog cards with rewards and rates.
      responses:
        "200":
          description: List of catalog cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogCard"
                required:
                  - cards
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/recommendations:
    get:
      summary: Rank catalog cards for a category (legacy path)
      description: Ranks non-retired catalog cards for a category.
      parameters:
        - schema:
            $ref: "#/components/schemas/CategoryName"
          required: true
          description: Allowed purchase categories in SwipeWise
          name: category
          in: query
        - schema:
            type: integer
          required: false
          name: amountCents
          in: query
      responses:
        "200":
          description: Ranked catalog cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: "#/components/schemas/CategoryName"
                  amountCents:
                    type: integer
                  bestCard:
                    allOf:
                      - $ref: "#/components/schemas/PublicRankedCard"
                      - nullable: true
                  rankedCards:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicRankedCard"
                required:
                  - category
                  - amountCents
                  - bestCard
                  - rankedCards
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/stores/search:
    get:
      summary: Search stores (legacy path)
      description: Search stores and return matching stores.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: true
          name: q
          in: query
      responses:
        "200":
          description: Matching stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoreSearchResult"
                required:
                  - stores
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/openapi.json:
    get:
      summary: Public OpenAPI JSON specification (legacy path)
      description: Returns the OpenAPI specification.
      responses:
        "200":
          description: OpenAPI specification document
          content:
            application/json:
              schema:
                nullable: true
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/signup:
    post:
      summary: Register new user account
      description: Creates an account with name, unique email, and argon2id password.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                confirmPassword:
                  type: string
                  minLength: 8
              required:
                - name
                - email
                - password
                - confirmPassword
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                    required:
                      - id
                      - email
                      - name
                required:
                  - user
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticates user and sets httpOnly JWT cookie.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                    required:
                      - id
                      - email
                      - name
                required:
                  - user
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      summary: User logout
      description: Clears httpOnly JWT cookie.
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
  /api/v1/auth/me:
    get:
      summary: Current authenticated user profile
      description: Returns the profile of the currently authenticated user.
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      timeZone:
                        type: string
                    required:
                      - id
                      - email
                      - name
                      - timeZone
                required:
                  - user
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/recommendations:
    get:
      summary: Best card recommendation for authenticated user
      description: Ranks cards in the user wallet for a category and purchase amount.
      parameters:
        - schema:
            $ref: "#/components/schemas/CategoryName"
          required: true
          description: Allowed purchase categories in SwipeWise
          name: category
          in: query
        - schema:
            type: integer
          required: false
          name: amountCents
          in: query
      responses:
        "200":
          description: Ranked user wallet cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: "#/components/schemas/CategoryName"
                  amountCents:
                    type: integer
                  isEmptyWallet:
                    type: boolean
                  rankedCards:
                    type: array
                    items:
                      nullable: true
                required:
                  - category
                  - amountCents
                  - isEmptyWallet
                  - rankedCards
        "401":
          description: Unauthorized
  /api/v1/stores/search:
    get:
      summary: Store search with category mapping
      description: Searches store directory for category lookup.
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: q
          in: query
      responses:
        "200":
          description: Matching stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoreSearchResult"
                required:
                  - stores
  /api/v1/catalog/cards:
    get:
      summary: List catalog credit cards
      description: Returns catalog cards available to add to wallet.
      responses:
        "200":
          description: Catalog cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogCard"
                required:
                  - cards
  /api/v1/wallet/cards:
    get:
      summary: List user wallet cards
      description: Returns all cards in the authenticated user's wallet.
      responses:
        "200":
          description: Wallet cards list
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletCards:
                    type: array
                    items:
                      nullable: true
                required:
                  - walletCards
        "401":
          description: Unauthorized
    post:
      summary: Add card to wallet
      description: Adds a catalog card to the user's wallet.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cardId:
                  type: string
                  format: uuid
                nickname:
                  type: string
              required:
                - cardId
      responses:
        "201":
          description: Card added to wallet
        "400":
          description: Validation error or Luhn card number rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
  /api/v1/wallet/cards/{id}:
    patch:
      summary: Update wallet card nickname
      description: Updates a wallet card's custom nickname.
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Wallet card updated
        "401":
          description: Unauthorized
        "404":
          description: Wallet card not found
    delete:
      summary: Delete card from wallet
      description: Removes a card from the user's wallet.
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Card removed from wallet
        "401":
          description: Unauthorized
        "404":
          description: Wallet card not found
  /api/v1/perks:
    get:
      summary: List user perks
      description: Returns recurring perks for cards in the user wallet.
      responses:
        "200":
          description: Perks list
        "401":
          description: Unauthorized
  /api/v1/bonus-offers:
    get:
      summary: List user bonus spend offers
      description: Returns welcome bonus offers and progress tracking.
      responses:
        "200":
          description: Bonus offers list
        "401":
          description: Unauthorized
  /api/v1/points-balances:
    get:
      summary: List reward points balances
      description: Returns program point balances and expiration dates.
      responses:
        "200":
          description: Points balances
        "401":
          description: Unauthorized
  /api/v1/notifications:
    get:
      summary: List user in-app notifications
      description: Returns unread notifications and alerts.
      responses:
        "200":
          description: Notifications list
        "401":
          description: Unauthorized
